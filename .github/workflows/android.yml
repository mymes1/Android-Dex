name: Standalone Android build and tests

on:
  push:
    branches: ['arena/**']
    paths: ['android/**', '.github/workflows/android.yml', '.github/scripts/android-smoke.sh']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml', '.github/scripts/android-smoke.sh']
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Compile debug, JVM tests and lint
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :app:lintDebug --continue --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-build.log"
      - name: Create disposable release-test key
        run: |
          PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$PASSWORD"
          keytool -genkeypair -keystore "$RUNNER_TEMP/dex-test.p12" -storetype PKCS12 \
            -alias dex-test -storepass "$PASSWORD" -keypass "$PASSWORD" \
            -dname 'CN=DeX CI Test, O=Local Test, C=US' -keyalg RSA -keysize 2048 -validity 30
          {
            echo 'DEX_KEYSTORE<<EOF'
            echo "$RUNNER_TEMP/dex-test.p12"
            echo EOF
            echo 'DEX_KEYSTORE_PASSWORD<<EOF'
            echo "$PASSWORD"
            echo EOF
            echo 'DEX_KEY_PASSWORD<<EOF'
            echo "$PASSWORD"
            echo EOF
            echo 'DEX_KEY_ALIAS=dex-test'
          } >> "$GITHUB_ENV"
      - name: Build optimized release APK with disposable test signature
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace 2>&1 | tee -a "$RUNNER_TEMP/android-build.log"
      - name: Verify and label APK
        run: |
          "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          mkdir -p "$RUNNER_TEMP/apks"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/apks/Shreys-Android-DeX-1.0.0-TEST-RELEASE.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apks/app-debug.apk"
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/apks/app-debug-androidTest.apk"
          sha256sum "$RUNNER_TEMP/apks/"*.apk | tee "$RUNNER_TEMP/apks/SHA256SUMS.txt"
      - name: Upload installable release test APK
        uses: actions/upload-artifact@v4
        with:
          name: Shreys-Android-DeX-test-release
          path: ${{ runner.temp }}/apks/Shreys-Android-DeX-*.apk
          retention-days: 14
      - name: Upload APKs for emulator job
        uses: actions/upload-artifact@v4
        with:
          name: android-test-inputs
          path: ${{ runner.temp }}/apks/
          retention-days: 3
      - name: Upload build and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish compiler diagnostics for API-only environments
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = process.env.RUNNER_TEMP + '/android-build.log';
            let log = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-45000) : 'Build failed before the compile step.';
            const extras = [];
            const testDir = 'android/app/build/test-results/testDebugUnitTest';
            if (fs.existsSync(testDir)) for (const f of fs.readdirSync(testDir).filter(f => f.endsWith('.xml'))) {
              const xml = fs.readFileSync(testDir + '/' + f, 'utf8');
              if (xml.includes('<failure')) extras.push(xml.slice(0, 12000));
            }
            for (const f of ['android/app/build/reports/lint-results-debug.txt', 'android/app/build/reports/lint-results-debug.xml']) {
              if (fs.existsSync(f)) extras.push(fs.readFileSync(f, 'utf8').slice(0, 12000));
            }
            if (extras.length) log += '\n\n--- test/lint details ---\n' + extras.join('\n').slice(0, 18000);
            await github.rest.checks.create({owner: context.repo.owner, repo: context.repo.repo,
              name: 'Android compiler diagnostics', head_sha: context.sha, status: 'completed', conclusion: 'failure',
              output: {title: 'Android build diagnostics', summary: '```text\n' + log.slice(0, 64000) + '\n```'}});

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-test-inputs
          path: ${{ runner.temp }}/apks
      - name: Fetch official Shizuku for authorization workflow test
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/apks/shizuku.apk" \
            https://github.com/RikkaApps/Shizuku/releases/download/v13.6.0/shizuku-v13.6.0.r1086.2650830c-release.apk
          test "$(stat -c%s "$RUNNER_TEMP/apks/shizuku.apk")" = 2571773
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: API 35 startup, Accessibility and official Shizuku authorization
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_DIR: ${{ runner.temp }}/apks
          REPORT_DIR: ${{ runner.temp }}/android-emulator-reports
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: Nexus 9
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash .github/scripts/android-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-evidence
          path: ${{ runner.temp }}/android-emulator-reports/
          if-no-files-found: ignore
          retention-days: 7
      - name: Publish emulator diagnostics for API-only environments
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.RUNNER_TEMP + '/android-emulator-reports';
            let summary = 'Emulator failed before producing reports.';
            for (const name of ['release-startup.txt', 'instrumentation.txt', 'shizuku-start.txt', 'shizuku-instrumentation.txt', 'summary.txt']) {
              const path = dir + '/' + name;
              if (fs.existsSync(path)) summary += '\n\n### ' + name + '\n```text\n' + fs.readFileSync(path, 'utf8').slice(-20000) + '\n```';
            }
            await github.rest.checks.create({owner: context.repo.owner, repo: context.repo.repo,
              name: 'Android emulator diagnostics', head_sha: context.sha, status: 'completed', conclusion: 'failure',
              output: {title: 'Android emulator diagnostics', summary}});
